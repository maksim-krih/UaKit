name: Pages

# Демо-сторінка «Сума прописом онлайн»: site/ + зібраний js/dist у site/uakit.
on:
  push:
    branches: [main]
    paths: ['site/**', 'js/src/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci && npm run build
        working-directory: js
      - run: rm -rf site/uakit && cp -r js/dist site/uakit
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
